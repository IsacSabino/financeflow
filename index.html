<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanceFlow | Dashboard Financeiro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand h1 {
      font-size: 32px;
      margin-bottom: 6px;
    }

    .brand p {
      color: #94a3b8;
      font-size: 15px;
    }

    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .top-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 24px;
    }

    .date-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 22px;
      padding: 22px;
      cursor: pointer;
      transition: 0.2s;
    }

    .date-card:hover {
      border-color: #38bdf8;
      transform: translateY(-1px);
    }

    .date-card label {
      display: block;
      font-size: 15px;
      color: #cbd5e1;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .date-card input {
      width: 100%;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid #475569;
      background: #020617;
      color: #f8fafc;
      font-size: 20px;
      outline: none;
      cursor: pointer;
      color-scheme: dark;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #020617;
      color: #f8fafc;
      outline: none;
      font-size: 15px;
      color-scheme: dark;
    }

    input[type="date"],
    input[type="month"] {
      color-scheme: dark;
    }

    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="month"]::-webkit-calendar-picker-indicator {
      filter: brightness(0) invert(1);
      opacity: 1;
      cursor: pointer;
    }

    input:focus,
    select:focus {
      border-color: #38bdf8;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 18px;
      padding: 24px;
    }

    .card span {
      display: block;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .card strong {
      font-size: 28px;
    }

    .saldo strong {
      color: #38bdf8;
    }

    .entrada strong {
      color: #22c55e;
    }

    .saida strong {
      color: #ef4444;
    }

    .grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .forms-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 18px;
      padding: 24px;
    }

    .panel h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .panel.receita {
      border-color: rgba(34, 197, 94, 0.35);
    }

    .panel.despesa {
      border-color: rgba(239, 68, 68, 0.35);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }

    label {
      font-size: 14px;
      color: #cbd5e1;
    }

    button {
      border: none;
      padding: 14px 16px;
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .btn-receita {
      background: #16a34a;
    }

    .btn-despesa {
      background: #dc2626;
    }

    .transactions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filters button {
      background: #1e293b;
      color: #cbd5e1;
      padding: 10px 14px;
      font-size: 13px;
    }

    .filters button.active {
      background: #2563eb;
      color: #fff;
    }

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transaction {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 16px;
    }

    .transaction-info h3 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .transaction-info p {
      font-size: 13px;
      color: #94a3b8;
    }

    .value {
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
    }

    .value.income {
      color: #22c55e;
    }

    .value.expense {
      color: #ef4444;
    }

    .delete {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 9px 11px;
      font-size: 13px;
    }

    .delete:hover {
      background: #7f1d1d;
      border-color: #ef4444;
      color: #fff;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 32px 10px;
      border: 1px dashed #334155;
      border-radius: 14px;
    }

    .annual-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .month-card {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .month-card:hover {
      border-color: #38bdf8;
      transform: translateY(-1px);
    }

    .month-card.current {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.2);
    }

    .month-card h3 {
      font-size: 16px;
      margin-bottom: 14px;
    }

    .month-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .month-row .positive {
      color: #22c55e;
      font-weight: 700;
    }

    .month-row .negative {
      color: #ef4444;
      font-weight: 700;
    }

    .month-row .balance {
      color: #38bdf8;
      font-weight: 700;
    }

    @media (max-width: 1000px) {
      .cards,
      .annual-grid,
      .top-controls {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .cards,
      .annual-grid,
      .top-controls {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .transactions-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .transaction {
        grid-template-columns: 1fr;
      }

      .brand h1 {
        font-size: 26px;
      }

      .card strong {
        font-size: 24px;
      }

      .date-card input {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>FinanceFlow</h1>
        <p>Dashboard financeiro pessoal com controle mensal e balanço anual</p>
      </div>

      <div class="badge">Projeto Front-end</div>
    </header>

    <section class="top-controls">
      <div class="date-card" data-open-picker="selectedMonth">
        <label for="selectedMonth">Visualizando mês:</label>
        <input type="month" id="selectedMonth" />
      </div>

      <div class="date-card" data-open-picker="selectedYear">
        <label for="selectedYear">Balanço anual:</label>
        <input type="number" id="selectedYear" min="2000" max="2100" />
      </div>
    </section>

    <section class="cards">
      <div class="card saldo">
        <span>Saldo do mês</span>
        <strong id="balance">R$ 0,00</strong>
      </div>

      <div class="card entrada">
        <span>Receitas do mês</span>
        <strong id="income">R$ 0,00</strong>
      </div>

      <div class="card saida">
        <span>Despesas do mês</span>
        <strong id="expense">R$ 0,00</strong>
      </div>
    </section>

    <main class="grid">
      <section class="forms-area">
        <div class="panel receita">
          <h2>Adicionar receita</h2>

          <form id="incomeForm">
            <div class="field">
              <label for="incomeDescription">Descrição</label>
              <input
                type="text"
                id="incomeDescription"
                placeholder="Ex: Salário, freelance, comissão"
                required
              />
            </div>

            <div class="field">
              <label for="incomeAmount">Valor</label>
              <input
                type="number"
                id="incomeAmount"
                placeholder="Ex: 2500.00"
                step="0.01"
                min="0.01"
                required
              />
            </div>

            <div class="field">
              <label for="incomeCategory">Categoria</label>
              <select id="incomeCategory" required>
                <option value="Salário">Salário</option>
                <option value="Freelance">Freelance</option>
                <option value="Comissão">Comissão</option>
                <option value="Investimentos">Investimentos</option>
                <option value="Outros">Outros</option>
              </select>
            </div>

            <div class="field" data-open-picker="incomeDate">
              <label for="incomeDate">Data da receita</label>
              <input type="date" id="incomeDate" required />
            </div>

            <button type="submit" class="btn-receita">Adicionar receita</button>
          </form>
        </div>

        <div class="panel despesa">
          <h2>Adicionar despesa</h2>

          <form id="expenseForm">
            <div class="field">
              <label for="expenseDescription">Descrição</label>
              <input
                type="text"
                id="expenseDescription"
                placeholder="Ex: Mercado, aluguel, gasolina"
                required
              />
            </div>

            <div class="field">
              <label for="expenseAmount">Valor</label>
              <input
                type="number"
                id="expenseAmount"
                placeholder="Ex: 150.00"
                step="0.01"
                min="0.01"
                required
              />
            </div>

            <div class="field">
              <label for="expenseCategory">Categoria</label>
              <select id="expenseCategory" required>
                <option value="Alimentação">Alimentação</option>
                <option value="Transporte">Transporte</option>
                <option value="Moradia">Moradia</option>
                <option value="Educação">Educação</option>
                <option value="Saúde">Saúde</option>
                <option value="Lazer">Lazer</option>
                <option value="Assinaturas">Assinaturas</option>
                <option value="Outros">Outros</option>
              </select>
            </div>

            <div class="field" data-open-picker="expenseDate">
              <label for="expenseDate">Data da despesa</label>
              <input type="date" id="expenseDate" required />
            </div>

            <button type="submit" class="btn-despesa">Adicionar despesa</button>
          </form>
        </div>
      </section>

      <section class="panel">
        <div class="transactions-header">
          <h2>Transações do mês</h2>

          <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="income">Receitas</button>
            <button class="filter-btn" data-filter="expense">Despesas</button>
          </div>
        </div>

        <div id="transactionList" class="transaction-list"></div>
      </section>
    </main>

    <section class="panel">
      <h2>Balanço anual</h2>
      <div id="annualBalance" class="annual-grid"></div>
    </section>
  </div>

  <script>
    const incomeForm = document.getElementById("incomeForm");
    const expenseForm = document.getElementById("expenseForm");

    const balanceElement = document.getElementById("balance");
    const incomeElement = document.getElementById("income");
    const expenseElement = document.getElementById("expense");
    const transactionList = document.getElementById("transactionList");
    const annualBalance = document.getElementById("annualBalance");

    const filterButtons = document.querySelectorAll(".filter-btn");

    const incomeDate = document.getElementById("incomeDate");
    const expenseDate = document.getElementById("expenseDate");
    const selectedMonth = document.getElementById("selectedMonth");
    const selectedYear = document.getElementById("selectedYear");

    const monthNames = [
      "Janeiro",
      "Fevereiro",
      "Março",
      "Abril",
      "Maio",
      "Junho",
      "Julho",
      "Agosto",
      "Setembro",
      "Outubro",
      "Novembro",
      "Dezembro",
    ];

    let currentFilter = "all";

    let transactions =
      JSON.parse(localStorage.getItem("financeflow-transactions")) || [];

    function openPicker(input) {
      if (!input) return;

      input.focus();

      if (typeof input.showPicker === "function") {
        input.showPicker();
      }
    }

    document.querySelectorAll("[data-open-picker]").forEach((box) => {
      box.addEventListener("click", function (event) {
        const inputId = this.dataset.openPicker;
        const input = document.getElementById(inputId);

        if (event.target.tagName !== "INPUT") {
          openPicker(input);
        }
      });
    });

    function getTodayDate() {
      return new Date().toISOString().split("T")[0];
    }

    function getCurrentMonthValue() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      return `${year}-${month}`;
    }

    incomeDate.value = getTodayDate();
    expenseDate.value = getTodayDate();
    selectedMonth.value = getCurrentMonthValue();
    selectedYear.value = new Date().getFullYear();

    function formatCurrency(value) {
      return value.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL",
      });
    }

    function formatDate(date) {
      const [year, month, day] = date.split("-");
      return `${day}/${month}/${year}`;
    }

    function getTransactionMonth(transaction) {
      return transaction.date.slice(0, 7);
    }

    function getTransactionYear(transaction) {
      return Number(transaction.date.slice(0, 4));
    }

    function saveTransactions() {
      localStorage.setItem(
        "financeflow-transactions",
        JSON.stringify(transactions)
      );
    }

    function addIncome(event) {
      event.preventDefault();

      const transaction = {
        id: Date.now(),
        type: "income",
        description: document.getElementById("incomeDescription").value.trim(),
        amount: Number(document.getElementById("incomeAmount").value),
        category: document.getElementById("incomeCategory").value,
        date: document.getElementById("incomeDate").value,
      };

      transactions.push(transaction);
      saveTransactions();

      incomeForm.reset();
      incomeDate.value = getTodayDate();

      render();
    }

    function addExpense(event) {
      event.preventDefault();

      const transaction = {
        id: Date.now(),
        type: "expense",
        description: document.getElementById("expenseDescription").value.trim(),
        amount: Number(document.getElementById("expenseAmount").value),
        category: document.getElementById("expenseCategory").value,
        date: document.getElementById("expenseDate").value,
      };

      transactions.push(transaction);
      saveTransactions();

      expenseForm.reset();
      expenseDate.value = getTodayDate();

      render();
    }

    function deleteTransaction(id) {
      transactions = transactions.filter((transaction) => transaction.id !== id);
      saveTransactions();
      render();
    }

    function getTransactionsFromSelectedMonth() {
      return transactions.filter((transaction) => {
        return getTransactionMonth(transaction) === selectedMonth.value;
      });
    }

    function calculateSummary() {
      const monthTransactions = getTransactionsFromSelectedMonth();

      const totalIncome = monthTransactions
        .filter((transaction) => transaction.type === "income")
        .reduce((total, transaction) => total + transaction.amount, 0);

      const totalExpense = monthTransactions
        .filter((transaction) => transaction.type === "expense")
        .reduce((total, transaction) => total + transaction.amount, 0);

      const balance = totalIncome - totalExpense;

      balanceElement.textContent = formatCurrency(balance);
      incomeElement.textContent = formatCurrency(totalIncome);
      expenseElement.textContent = formatCurrency(totalExpense);
    }

    function renderTransactions() {
      transactionList.innerHTML = "";

      const monthTransactions = getTransactionsFromSelectedMonth();

      const filteredTransactions = monthTransactions.filter((transaction) => {
        if (currentFilter === "all") return true;
        return transaction.type === currentFilter;
      });

      if (filteredTransactions.length === 0) {
        transactionList.innerHTML = `
          <div class="empty">
            Nenhuma transação encontrada para este mês.
          </div>
        `;
        return;
      }

      filteredTransactions
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .forEach((transaction) => {
          const transactionElement = document.createElement("div");
          transactionElement.classList.add("transaction");

          const valueClass =
            transaction.type === "income" ? "income" : "expense";

          const signal = transaction.type === "income" ? "+" : "-";

          const typeLabel =
            transaction.type === "income" ? "Receita" : "Despesa";

          transactionElement.innerHTML = `
            <div class="transaction-info">
              <h3>${transaction.description}</h3>
              <p>${typeLabel} • ${transaction.category} • ${formatDate(transaction.date)}</p>
            </div>

            <div class="value ${valueClass}">
              ${signal} ${formatCurrency(transaction.amount)}
            </div>

            <button class="delete" onclick="deleteTransaction(${transaction.id})">
              Excluir
            </button>
          `;

          transactionList.appendChild(transactionElement);
        });
    }

    function renderAnnualBalance() {
      annualBalance.innerHTML = "";

      const year = Number(selectedYear.value);
      const currentMonthValue = selectedMonth.value;

      monthNames.forEach((monthName, index) => {
        const monthNumber = String(index + 1).padStart(2, "0");
        const monthValue = `${year}-${monthNumber}`;

        const monthTransactions = transactions.filter((transaction) => {
          return (
            getTransactionYear(transaction) === year &&
            getTransactionMonth(transaction) === monthValue
          );
        });

        const income = monthTransactions
          .filter((transaction) => transaction.type === "income")
          .reduce((total, transaction) => total + transaction.amount, 0);

        const expense = monthTransactions
          .filter((transaction) => transaction.type === "expense")
          .reduce((total, transaction) => total + transaction.amount, 0);

        const balance = income - expense;

        const monthCard = document.createElement("div");
        monthCard.classList.add("month-card");

        if (monthValue === currentMonthValue) {
          monthCard.classList.add("current");
        }

        monthCard.innerHTML = `
          <h3>${monthName}</h3>

          <div class="month-row">
            <span>Receitas</span>
            <span class="positive">${formatCurrency(income)}</span>
          </div>

          <div class="month-row">
            <span>Despesas</span>
            <span class="negative">${formatCurrency(expense)}</span>
          </div>

          <div class="month-row">
            <span>Saldo</span>
            <span class="balance">${formatCurrency(balance)}</span>
          </div>
        `;

        monthCard.addEventListener("click", () => {
          selectedMonth.value = monthValue;
          render();
          openPicker(selectedMonth);
        });

        annualBalance.appendChild(monthCard);
      });
    }

    function handleFilterClick(event) {
      filterButtons.forEach((button) => button.classList.remove("active"));

      event.target.classList.add("active");
      currentFilter = event.target.dataset.filter;

      renderTransactions();
    }

    function render() {
      calculateSummary();
      renderTransactions();
      renderAnnualBalance();
    }

    incomeForm.addEventListener("submit", addIncome);
    expenseForm.addEventListener("submit", addExpense);

    selectedMonth.addEventListener("change", render);
    selectedYear.addEventListener("input", renderAnnualBalance);

    filterButtons.forEach((button) => {
      button.addEventListener("click", handleFilterClick);
    });

    render();
  </script>
</body>
</html>
